<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e70">
  <title>Agenda de Citas a Tutores · EPOANT</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
    #app{width:100%;height:100%;border:0;display:block;background:#f4f7fb}
    .fallback{display:none;max-width:720px;margin:40px auto;padding:24px;background:#fff;border:1px solid #dce6f0;border-radius:18px;text-align:center;color:#17324d}
    .fallback a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;background:#0b7285;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <iframe id="app" title="Agenda de Citas a Tutores EPOANT" allow="clipboard-write"></iframe>
  <div id="fallback" class="fallback">
    <h2>Agenda de Citas a Tutores</h2>
    <p>Si la aplicación no abre automáticamente, usa el botón siguiente.</p>
    <a href="https://script.google.com/macros/s/AKfycbzb_j0ZSYwCvtFdf_WvIolyZzPWZwUszpn1FzVvvQPzvrW8a5cNImdF_bReQWYCxFq0/exec" target="_blank" rel="noopener">Abrir Agenda de Citas</a>
  </div>

  <script>
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbzb_j0ZSYwCvtFdf_WvIolyZzPWZwUszpn1FzVvvQPzvrW8a5cNImdF_bReQWYCxFq0/exec";

    (function(){
      const iframe = document.getElementById("app");
      const fallback = document.getElementById("fallback");
      const params = new URLSearchParams(window.location.search);
      const target = new URL(APPS_SCRIPT_EXEC_URL);

      params.forEach((value, key) => target.searchParams.set(key, value));
      iframe.src = target.toString();

      // Fallback visual si el iframe no carga por alguna política temporal del navegador.
      setTimeout(() => {
        try {
          if (!iframe.src) {
            iframe.style.display = "none";
            fallback.style.display = "block";
          }
        } catch (e) {}
      }, 5000);
    })();
  </script>
</body>
</html>
