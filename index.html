<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7285">
  <title>Agenda de Citas EPOANT</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f4f7fb;font-family:Arial,sans-serif}
    #app{width:100%;height:100%;border:0;display:block;background:#f4f7fb}
    #configError{display:none;max-width:760px;margin:40px auto;padding:24px;border-radius:16px;background:#fff;border:1px solid #dce6f0;color:#17324d;box-shadow:0 8px 30px rgba(24,55,88,.08)}
    #configError code{display:block;margin-top:12px;padding:12px;border-radius:10px;background:#f3f8fc;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <iframe id="app" title="Agenda de Citas EPOANT" allow="clipboard-write"></iframe>
  <div id="configError">
    <h2>Falta vincular la aplicación</h2>
    <p>Reemplaza <strong>PEGAR_AQUI_URL_EXEC</strong> por la URL <code>/exec</code> de tu implementación de Google Apps Script.</p>
  </div>

  <script>
    const APPS_SCRIPT_EXEC_URL = 'PEGAR_AQUI_URL_EXEC';

    (function(){
      const iframe = document.getElementById('app');
      const error = document.getElementById('configError');

      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(APPS_SCRIPT_EXEC_URL)) {
        iframe.style.display = 'none';
        error.style.display = 'block';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const target = new URL(APPS_SCRIPT_EXEC_URL);

      params.forEach((value,key)=>{
        target.searchParams.set(key,value);
      });

      iframe.src = target.toString();
    })();
  </script>
</body>
</html>
